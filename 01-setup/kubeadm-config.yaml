apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration

kubernetesVersion: "v1.33.13"

networking:
  serviceSubnet: "10.96.0.0/16"
  podSubnet: "10.244.0.0/16"

---

apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

cgroupDriver: systemd

---

apiVersion: kubeadm.k8s.io/v1beta3
kind: InitConfiguration

localAPIEndpoint:
# USE A PUBLIC IP ADDRESS AS THE ADVERTISE ADDRESS
# OR THE PRIVATE NETWORK THAT THE INSTANCE ARE
# ALSO ENSURE TO ONLY ALLOW 6443 WITH UFW ACCESSIBLE FROM THE EACH NODES ALONE
  advertiseAddress: "<public-ip-address>"
  bindPort: 6443
